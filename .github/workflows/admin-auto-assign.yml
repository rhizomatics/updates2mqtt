# Managed by rhizomatics/hq (admin/sync-admin.sh) - edit there, not here.
name: Auto assign

on:
  issues:
    types: [opened, reopened]
  # pull_request_target so fork PRs get a writable token; the called workflow never runs PR code.
  pull_request_target:
    types: [opened, reopened]

# Nothing by default; each job grants only what it needs (OpenSSF Scorecard Token-Permissions).
permissions: {}

jobs:
  auto-assign:
    permissions:
      issues: write
      pull-requests: write
    uses: rhizomatics/hq/.github/workflows/reusable-auto-assign.yml@5c22e38809c2209b38d5ed13e2a8ea01b9c2d96e # v1.0.0
