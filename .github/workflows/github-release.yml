# Managed by rhizomatics/hq (admin/sync-admin.sh) - edit there, not here.
#
# Publishes the GitHub release for the version tag this run is for. Called by the repo's release workflow once
# CI and the build have passed (policies/release_workflows.md). Releases are immutable once published, so the
# release is built up as a draft and published last:
#   1. notes: the tag's section of CHANGELOG.md (headed `# 1.2.3`, `# v1.2.3`, `## [1.2.3]` or `## 1.2.3 - date`;
#      a pre-release falls back to the section of the version it leads to), followed by GitHub's generated
#      notes (merged PRs, new contributors, full changelog link)
#   2. files: everything in the caller's `artifact`, if it names one (zip, wheel, sdist, checksums)
#   3. publish: a version with a suffix (1.2.3-beta1, 1.2.3-rc.1) is published as a pre-release, and never
#      marked latest
# It fails before creating anything if the run isn't for a version tag, or the changelog has no section for it.
# A draft left by a failed run is picked up and finished by the next one; a published release is never touched.
name: GitHub release

on:
  workflow_call:
    inputs:
      artifact:
        description: "Name of an artifact uploaded earlier in the run, whose files are attached to the release"
        type: string
        default: ""
      changelog:
        description: "Path of the changelog in the repo"
        type: string
        default: CHANGELOG.md
    outputs:
      prerelease:
        description: "'true' when the version has a pre-release suffix"
        value: ${{ jobs.release.outputs.prerelease }}

permissions: {}

jobs:
  release:
    name: Publish the GitHub release
    runs-on: ubuntu-latest
    permissions:
      # to create the draft, attach the files and publish it; no repo code is checked out or run here
      contents: write
    outputs:
      prerelease: ${{ steps.notes.outputs.prerelease }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      CHANGELOG: ${{ inputs.changelog }}
    steps:
      - name: Write the release notes
        id: notes
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag || ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::A release runs for a version tag, such as v1.2.3 or v1.2.3-beta1, not the $GITHUB_REF_TYPE $TAG"
            exit 1
          fi
          version=${TAG#v}
          prerelease=false
          [[ $version == *-* ]] && prerelease=true
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

          gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/$CHANGELOG?ref=$TAG" > changelog.md
          # The section headed by the version, at level 1 or 2, as `1.2.3`, `v1.2.3` or `[1.2.3]`, optionally
          # followed by a date, up to the next heading of the same or a higher level outside a code block
          section() {
            awk -v v="$1" '
              /^```/ { fence = !fence }
              !fence && /^##? / {
                level = index($0, " ") - 1
                if (found) { if (level <= flevel) exit; print; next }
                h = $2; sub(/^\[/, "", h); sub(/\].*$/, "", h); sub(/^v/, "", h)
                if (h == v) { found = 1; flevel = level; next }
              }
              found { print }
              END { exit !found }' changelog.md
          }
          # a pre-release's notes may be written under the version it leads up to
          if ! { section "$version" || section "${version%%-*}"; } > notes.md || ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::$CHANGELOG at $TAG has no notes under a '# $version' heading. Add them, merge, and tag again."
            exit 1
          fi
          {
            echo
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" --jq .body
          } >> notes.md
          cat notes.md

      - name: Fetch the files to attach
        if: inputs.artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: release-files/

      - name: Draft, attach the files and publish
        env:
          PRERELEASE: ${{ steps.notes.outputs.prerelease }}
        run: |
          repo=(--repo "$GITHUB_REPOSITORY")
          if is_draft=$(gh release view "$TAG" "${repo[@]}" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ $is_draft != true ]]; then
              echo "::error::$TAG is already published, and a published release can't be changed. Release a new version."
              exit 1
            fi
            echo "Finishing the draft of $TAG left by an earlier run"
            gh release edit "$TAG" "${repo[@]}" --notes-file notes.md --prerelease="$PRERELEASE"
          else
            gh release create "$TAG" "${repo[@]}" --draft --verify-tag --title "$TAG" --notes-file notes.md \
              --prerelease="$PRERELEASE"
          fi

          shopt -s nullglob
          files=(release-files/*)
          if (( ${#files[@]} )); then
            gh release upload "$TAG" "${repo[@]}" --clobber "${files[@]}"
          fi

          latest=true
          [[ $PRERELEASE == true ]] && latest=false
          gh release edit "$TAG" "${repo[@]}" --draft=false --latest="$latest"
