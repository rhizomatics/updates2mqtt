name: Publish Python 🐍 distribution 📦 to PyPI and TestPyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      force:
        description: "Skip CI and publish anyway (emergency use only, e.g. security fix blocked by a minor build break)"
        type: boolean
        default: false
      repository:
        description: "Where to publish"
        type: choice
        options: [ pypi, testpypi ]
        default: pypi

permissions:
  contents: read

jobs:
  ci:
    if: ${{ !inputs.force }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: write  # ci.yml's docs job asks for it, though it only runs on pushes to main

  build:
    name: Build distribution 📦
    needs: ci
    # Publish only on a clean CI run, unless forced
    if: ${{ !cancelled() && (needs.ci.result == 'success' || (inputs.force && needs.ci.result == 'skipped')) }}
    runs-on: ubuntu-slim

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        python-version: 3.14
    - name: Install dependencies
      run: uv sync --locked --all-extras --dev
    - name: Build a binary wheel and a source tarball
      run: uv build
    - name: Store the distribution packages
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    # Publish to PyPI on full releases (not pre-releases), or when chosen on a manual run
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && (
        (github.event_name == 'release' && github.event.release.prerelease == false) ||
        (github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi')) }}
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/updates2mqtt
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-to-testpypi:
    name: Publish Python 🐍 distribution 📦 to TestPyPI
    # Publish to TestPyPI on pre-releases, or when chosen on a manual run
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && (
        (github.event_name == 'release' && github.event.release.prerelease == true) ||
        (github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi')) }}
    needs:
    - build
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/updates2mqtt

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to TestPyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true
