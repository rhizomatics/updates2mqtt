# Lint, test and build across supported Python versions; on PRs check the docs build, on main publish badges and docs.
# Also called by docker-publish.yml and pypi-publish.yml to gate releases on a clean build.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.13", "3.14", "3.15" ]
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: uv sync --locked --all-extras --dev
    - name: Ruff
      uses:  astral-sh/ruff-action@v3
    - name: ty
      # keep in step with ty-pre-commit rev in .pre-commit-config.yaml
      run: uvx --exclude-newer-package ty=false ty@0.0.87 check
    - name: Test with pytest
      run: uv run pytest tests
    - name: Build a binary wheel and a source tarball
      run: uv build
    - name: Store test results for badges
      if: matrix.python-version == '3.14'
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: |
          cov.xml
          junit/test-results.xml

  image:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: 3.14
    - name: Install dependencies
      run: uv sync --locked --all-extras --dev
    - name: Build image and check it starts
      run: uv run pytest tests/integration/test_image.py --integration -o addopts=""

  docs:
    name: Badges and docs
    needs: test
    # Not when called from a release workflow
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: 3.14
    - name: Install dependencies
      run: uv sync --locked --all-extras --dev
    # badges and docs publish from main only, PR checkouts are detached so can't pull or push
    - name: Download test results
      if: github.event_name == 'push'
      uses: actions/download-artifact@v8
      with:
        name: test-results
    - name: Generate badges
      if: github.event_name == 'push'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        uv run genbadge coverage -i cov.xml -o badges/coverage.svg
        uv run genbadge tests -i junit/test-results.xml -o badges/tests.svg

        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        TEMP_DIR=$(mktemp -d)
        cd $TEMP_DIR
        git clone --single-branch --branch badges https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git . 2>/dev/null
        cp -r ${{ github.workspace }}/badges .
        git add badges
        if git commit -m "Update badges [skip ci]"; then
          git push origin badges --force
          echo "Badges updated successfully"
        else
          echo "No changes to badges"
        fi

    - name: ProperDocs build check
      if: github.event_name == 'pull_request'
      run:  |
        uv sync --dev --group docs
        sudo apt-get install pngquant
        uv run properdocs build
    - name: ProperDocs
      if: github.event_name == 'push'
      run:  |
        git pull
        uv sync --dev --group docs
        sudo apt-get install pngquant
        uv run properdocs gh-deploy
