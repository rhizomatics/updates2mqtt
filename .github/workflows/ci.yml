# Lint, test and build across supported Python versions, and on PRs check the docs build.
# Also called by docker-publish.yml and pypi-publish.yml to gate releases on a clean build, so it only
# ever reads the repo; badges and docs are published from main by docs.yml, which can write.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.13", "3.14", "3.15" ]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: uv sync --locked --all-extras --dev
    - name: Ruff
      uses:  astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89
    - name: ty
      # keep in step with ty-pre-commit rev in .pre-commit-config.yaml
      run: uvx --exclude-newer-package ty=false ty@0.0.87 check
    - name: Test with pytest
      run: uv run pytest tests
    - name: Build a binary wheel and a source tarball
      run: uv build
    - name: Store test results for badges
      if: matrix.python-version == '3.14'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-results
        path: |
          cov.xml
          junit/test-results.xml

  image:
    name: Docker image smoke test
    # needs a Docker engine, ubuntu-slim has only the client. Fails on ubuntu-26.04, broker name doesn't resolve
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: 3.14
    - name: Install dependencies
      run: uv sync --locked --all-extras --dev
    - name: Build image and check it starts
      run: uv run pytest tests/integration/test_image.py --integration -o addopts=""

  docs-check:
    name: Docs build check
    needs: test
    # Builds pull request code, so read-only, with no credentials left in the checkout
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: 3.14
    - name: ProperDocs build check
      run:  |
        uv sync --locked --dev --group docs
        sudo apt-get update
        sudo apt-get install pngquant
        uv run properdocs build
