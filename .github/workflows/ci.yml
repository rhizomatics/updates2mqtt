# Lint, test and build across supported Python versions; on PRs check the docs build, on main publish badges and docs.
# Also called by docker-publish.yml and pypi-publish.yml to gate releases on a clean build.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.13", "3.14", "3.15" ]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: uv sync --locked --all-extras --dev
    - name: Ruff
      uses:  astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89
    - name: ty
      # keep in step with ty-pre-commit rev in .pre-commit-config.yaml
      run: uvx --exclude-newer-package ty=false ty@0.0.87 check
    - name: Test with pytest
      run: uv run pytest tests
    - name: Build a binary wheel and a source tarball
      run: uv build
    - name: Store test results for badges
      if: matrix.python-version == '3.14'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-results
        path: |
          cov.xml
          junit/test-results.xml

  image:
    name: Docker image smoke test
    # needs a Docker engine, ubuntu-slim has only the client. Fails on ubuntu-26.04, broker name doesn't resolve
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: 3.14
    - name: Install dependencies
      run: uv sync --locked --all-extras --dev
    - name: Build image and check it starts
      run: uv run pytest tests/integration/test_image.py --integration -o addopts=""

  docs-check:
    name: Docs build check
    needs: test
    # Builds pull request code, so read-only, with no credentials left in the checkout
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: 3.14
    - name: ProperDocs build check
      run:  |
        uv sync --locked --dev --group docs
        sudo apt-get update
        sudo apt-get install pngquant
        uv run properdocs build

  docs:
    name: Badges and docs
    needs: test
    # Only for main, never pull requests, as this job can write to the repo. Not when called from a release workflow
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # deploys from main push to gh-pages, so one at a time, or a later push is rejected as not a fast-forward;
    # a deploy waiting behind another is replaced by any newer one, so the latest docs win, and nothing is cancelled
    # mid-push.
    concurrency:
      group: docs-deploy-main
      cancel-in-progress: false
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: 3.14
    - name: Install dependencies
      run: uv sync --locked --all-extras --dev
    - name: Download test results
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: test-results
    - name: Generate badges
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        uv run genbadge coverage -i cov.xml -o badges/coverage.svg
        uv run genbadge tests -i junit/test-results.xml -o badges/tests.svg

        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        TEMP_DIR=$(mktemp -d)
        cd $TEMP_DIR
        git clone --single-branch --branch badges "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" . 2>/dev/null
        cp -r "${GITHUB_WORKSPACE}/badges" .
        git add badges
        if git commit -m "Update badges [skip ci]"; then
          git push origin badges --force
          echo "Badges updated successfully"
        else
          echo "No changes to badges"
        fi

    - name: ProperDocs
      run:  |
        git pull --no-tags
        uv sync --dev --group docs
        sudo apt-get update
        sudo apt-get install pngquant
        uv run properdocs gh-deploy
