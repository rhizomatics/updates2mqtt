# Publishes the coverage and test badges, and the documentation site, from main.
# Kept apart from ci.yml, the only workflow here that writes to the repo, so ci.yml and the release
# workflows that call it run with a read-only token. Runs the tests once more, on one Python version,
# for the badge figures and the HTML coverage report, and so docs are only published from code that passes.

name: Badges and docs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions: {}

jobs:
  docs:
    name: Badges and docs
    # deploys to gh-pages, so one at a time, or a later push is rejected as not a fast-forward;
    # a deploy waiting behind another is replaced by any newer one, so the latest docs win, and nothing is cancelled
    # mid-push.
    concurrency:
      group: docs-deploy-main
      cancel-in-progress: false
    runs-on: ubuntu-slim
    permissions:
      contents: write  # push to the badges and gh-pages branches
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: 3.14
    - name: Install dependencies
      run: uv sync --locked --all-extras --dev
    # also writes htmlcov/, published by the coverage plugin as developer/coverage/, which only warns and
    # leaves the page out if the report is missing
    - name: Test, for badge figures and coverage report
      run: |
        uv run pytest tests
        test -f htmlcov/index.html || { echo "::error::No HTML coverage report for developer/coverage/"; exit 1; }
    - name: Generate badges
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        uv run genbadge coverage -i cov.xml -o badges/coverage.svg
        uv run genbadge tests -i junit/test-results.xml -o badges/tests.svg

        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        TEMP_DIR=$(mktemp -d)
        cd $TEMP_DIR
        git clone --single-branch --branch badges "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" . 2>/dev/null
        cp -r "${GITHUB_WORKSPACE}/badges" .
        git add badges
        if git commit -m "Update badges [skip ci]"; then
          git push origin badges --force
          echo "Badges updated successfully"
        else
          echo "No changes to badges"
        fi

    - name: ProperDocs
      run:  |
        git pull --no-tags
        uv sync --dev --group docs
        sudo apt-get update
        sudo apt-get install pngquant
        uv run properdocs gh-deploy
