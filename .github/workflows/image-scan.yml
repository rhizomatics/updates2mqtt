# Scans the published image for vulnerabilities that have a fix available. The base image and apt
# packages only change when the image is rebuilt, so the weekly run rebuilds the latest release
# when a rebuild would pick up a fix. No new release is needed.
#
# Version tags are immutable, so a rebuild is published as a new revision, e.g. `1.18.0-r1`, and the
# floating `1.18` and `release` tags move to it, see docker-publish.yml.
#
# The base image is pinned by digest in the Dockerfile. A rebuild moves to the tag's current digest
# only once that has been out for BASE_COOLDOWN_DAYS, the same wait Dependabot applies before it
# proposes the new digest for the next release. Debian's apt packages have no such wait, a rebuild
# takes whatever the Debian security archive has that day.
#
# Findings go to code scanning. The scan after each publish closes those the rebuild fixed, so what
# stays open needs a person: a locked Python dependency, a pinned Docker tool waiting on a version
# bump, or a fix not yet shipped upstream.
name: Scan published image

on:
  schedule:
    - cron: "23 1 * * 1"
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Rebuild the latest release if a rebuild would pick up a critical or high fix"
        type: boolean
        default: false
  workflow_run:
    workflows: ["Create and publish a Docker image"]
    types: [completed]

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}:release
  BASE_COOLDOWN_DAYS: 7

jobs:
  scan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # No actions: write here, so the scanner and other third-party actions never hold a token that
    # can start workflows; the rebuild job below does that on its own
    permissions:
      contents: read
      security-events: write
    outputs:
      apt: ${{ steps.fixable.outputs.apt }}
      base: ${{ steps.fixable.outputs.base }}
      tag: ${{ steps.base.outputs.tag }}
      image: ${{ steps.base.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan for code scanning
        id: sarif
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}
          only-fixed: true
          fail-build: false
          output-format: sarif

      # Uploaded before any rebuild, so a rebuild that fails still leaves the findings visible
      - name: Upload findings
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.sarif.outputs.sarif }}
          category: published-image

      - name: Scan for rebuild decision
        id: json
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}
          only-fixed: true
          fail-build: false
          output-format: json

      # upload-sarif feeds code scanning only, so keep both reports with the run as well
      - name: Keep reports with the run
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-scan-reports
          path: |
            ${{ steps.sarif.outputs.sarif }}
            ${{ steps.json.outputs.json }}
          if-no-files-found: warn

      # Only apt packages and the base image's own binaries change on a rebuild. Python packages are
      # held by uv.lock, and the Docker CLI, buildx and compose by the image tags pinned at the top of
      # the Dockerfile, so their Go modules and binaries need a Dependabot bump and never count here;
      # otherwise a fix only a version bump can bring would rebuild and publish a new revision every week.
      # Apt packages are upgraded by any rebuild, the base image's binaries only by a newer base image.
      - name: Count what a rebuild would fix
        id: fixable
        env:
          REPORT: ${{ steps.json.outputs.json }}
        run: |
          severe='select(.vulnerability.severity | ascii_downcase | . == "critical" or . == "high")'
          pinned='[.artifact.locations[]?.path] | any(startswith("/usr/local/bin/docker") or startswith("/usr/libexec/docker/"))'
          apt=$(jq "[.matches[] | select(.artifact.type == \"deb\") | $severe] | length" "$REPORT")
          base=$(jq "[.matches[] | select(.artifact.type == \"binary\") | select($pinned | not) | $severe] | length" "$REPORT")
          echo "$apt critical/high findings an apt upgrade would fix, $base a newer base image might"
          echo "apt=$apt" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      # The newest digest of the base image tag, if it differs from the one pinned in the release's
      # Dockerfile and has been published for the cooldown. Docker Hub reports when a tag was last
      # pushed, which is when its current digest appeared.
      - name: Find a base image past its cooldown
        id: base
        if: github.event_name == 'schedule' || inputs.rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          pinned=$(gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/Dockerfile?ref=$tag" |
            sed -nE 's/^FROM ([^ ]+@sha256:[0-9a-f]{64}) AS python-base$/\1/p')
          if [[ -z "$pinned" ]]; then
            echo "Release $tag doesn't pin its base image by digest, so a rebuild takes the tag as it is today"
            exit 0
          fi
          name_tag="${pinned%@*}"
          repo="${name_tag%%:*}"
          [[ "$repo" == */* ]] || repo="library/$repo"

          info=$(curl -fsSL "https://hub.docker.com/v2/repositories/$repo/tags/${name_tag#*:}")
          digest=$(jq -r '.digest // empty' <<<"$info")
          pushed=$(jq -r '.tag_last_pushed // empty' <<<"$info")
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ || -z "$pushed" ]]; then
            echo "::warning::No digest or push time from Docker Hub for $name_tag, keeping the pinned base image"
            exit 0
          fi
          age_days=$(( ($(date +%s) - $(date -d "$pushed" +%s)) / 86400 ))
          if [[ "$digest" == "${pinned#*@}" ]]; then
            echo "$name_tag is still at the pinned digest"
          elif (( age_days < BASE_COOLDOWN_DAYS )); then
            echo "Newer $name_tag is $age_days days old, under the $BASE_COOLDOWN_DAYS day cooldown, keeping the pinned base image"
          else
            echo "Newer $name_tag is $age_days days old, past its cooldown: $digest"
            echo "image=$name_tag@$digest" >> "$GITHUB_OUTPUT"
          fi

  # Never on workflow_run: that is the scan after a publish, and rebuilding from it could loop.
  # Runs docker-publish.yml from main, so the rebuild uses the current workflow, on the release's code.
  rebuild:
    name: Rebuild the latest release
    needs: scan
    if: >-
      (github.event_name == 'schedule' || inputs.rebuild) &&
      (needs.scan.outputs.apt != '0' || (needs.scan.outputs.base != '0' && needs.scan.outputs.image != ''))
    runs-on: ubuntu-slim
    # actions: write only to dispatch docker-publish.yml, in a job with no other steps or actions
    permissions:
      actions: write
    steps:
      - name: Rebuild the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.scan.outputs.tag }}
          BASE_IMAGE: ${{ needs.scan.outputs.image }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          echo "Rebuilding $TAG as a new revision${BASE_IMAGE:+, on $BASE_IMAGE}"
          gh workflow run docker-publish.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" \
            -f "release_tag=$TAG" ${BASE_IMAGE:+-f "base_image=$BASE_IMAGE"}
