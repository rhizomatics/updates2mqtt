name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Nothing by default; each job grants only what it needs (OpenSSF Scorecard Token-Permissions).
permissions: {}

jobs:
  automerge:
    permissions:
      contents: write
      pull-requests: write
