#
name: Create and publish a Docker image

# Runs when a release is published. A version tag, such as `1.18.0`, is published once and never
# pushed again: if it's already in the registry the run fails. A rebuild of an existing release, to
# pick up base image and apt fixes, is published as a new revision, `1.18.0-r1`, `1.18.0-r2` and so
# on, and only the floating `1.18` and `release` tags move to it.
on:
  release:
    types: [published]
  # Manual run. To publish a release, select its tag as the ref. To rebuild a release that's already
  # published, run from main with `release_tag` set, as the weekly image scan does.
  workflow_dispatch:
    inputs:
      force:
        description: "Skip CI and publish anyway (emergency use only, e.g. security fix blocked by a minor build break)"
        type: boolean
        default: false
      release_tag:
        description: "Rebuild this published release, e.g. v1.18.0, as a new revision such as 1.18.0-r1. Run from main"
        type: string
        default: ""
      base_image:
        description: "Base image for a rebuild, as name:tag@sha256:digest. Default is the one pinned in the Dockerfile"
        type: string
        default: ""


# Defines two custom environment variables for the workflow. These are used for the Container registry domain, and a name for the Docker image that this workflow builds.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions: {}

jobs:
  ci:
    # A rebuild is of code that passed CI when it was released, and CI here would test main instead
    if: ${{ !inputs.force && !inputs.release_tag }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: write  # ci.yml's docs job asks for it, though it only runs on pushes to main

  build-and-push-image:
    needs: ci
    # Publish only on a clean CI run, unless forced, or rebuilding an existing release
    if: ${{ !cancelled() && (needs.ci.result == 'success' || (needs.ci.result == 'skipped' && (inputs.force || inputs.release_tag != ''))) }}
    runs-on: ubuntu-latest
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      #
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the release being rebuilt, otherwise whatever triggered the run
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      # Uses the `docker/login-action` action to log in to the Container registry registry using the account and password that will publish the packages. Once published, the packages are scoped to the account defined here.
      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Version tags are immutable, so this fails rather than push one a second time. Users, and
      # Updates2MQTT's own tag move detection, can then rely on `1.18.0` always being the same image.
      - name: Choose the version tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          BASE_IMAGE: ${{ inputs.base_image }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME,,}"

          # exit status 0 if the tag is in the registry, 1 if not, and the run fails if that can't be told
          tag_exists() {
            local out
            if out=$(docker buildx imagetools inspect "$image:$1" 2>&1); then
              return 0
            fi
            if grep -qiE "not found|manifest unknown|name unknown" <<<"$out"; then
              return 1
            fi
            echo "::error::Unable to check whether $image:$1 exists: $out"
            exit 1
          }

          if [[ -n "$BASE_IMAGE" && ! "$BASE_IMAGE" =~ ^[a-z0-9./_-]+:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::base_image must be name:tag@sha256:digest"
            exit 1
          fi
          if [[ -n "$BASE_IMAGE" && -z "$RELEASE_TAG" ]]; then
            echo "::error::base_image is only for rebuilds, set release_tag as well"
            exit 1
          fi

          ref="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          version="${ref#v}"
          echo "revision=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.+-]+)?$ ]]; then
            if [[ -n "$RELEASE_TAG" ]]; then
              echo "::error::release_tag $RELEASE_TAG is not a version tag"
              exit 1
            fi
            # a manual run on a branch, so there's no version tag to protect
            echo "label_version=$ref" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$RELEASE_TAG" ]]; then
            if tag_exists "$version"; then
              echo "::error::$image:$version is already published, and version tags are immutable. To rebuild it as a new revision, run this workflow from main with release_tag set"
              exit 1
            fi
            tag="$version"
          else
            if ! tag_exists "$version"; then
              echo "::error::$image:$version isn't published, so there's nothing to rebuild"
              exit 1
            fi
            n=1
            while tag_exists "$version-r$n"; do
              n=$((n + 1))
            done
            tag="$version-r$n"
          fi
          echo "Publishing $image:$tag"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "label_version=$version"
          } >>"$GITHUB_OUTPUT"

      # This step uses [docker/metadata-action](https://github.com/docker/metadata-action#about) to extract tags and labels that will be applied to the specified image. The `id` "meta" allows the output of this step to be referenced in a subsequent step. The `images` value provides the base name for the tags and labels.
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # the version tag, or the revision for a rebuild, then the floating tags that move to it
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }},enable=${{ steps.version.outputs.tag != '' }},priority=1000
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=ref,event=branch,enable=${{ inputs.release_tag == '' }}
            type=raw,value=release
          # a rebuild keeps its release's version and commit, rather than the revision tag and the commit of main
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.label_version }}
            org.opencontainers.image.revision=${{ steps.version.outputs.revision }}
          annotations: |
            org.opencontainers.image.documentation=https://updates2mqtt.rhizomatics.org.uk
            org.opencontainers.image.vendor=Rhizomatics Open Source
            org.opencontainers.image.version=${{ steps.version.outputs.label_version }}
            org.opencontainers.image.revision=${{ steps.version.outputs.revision }}

      # This step uses the `docker/build-push-action` action to build the image, based on your repository's `Dockerfile`. If the build succeeds, it pushes the image to GitHub Packages.
      # It uses the `context` parameter to define the build's context as the set of files located in the specified path. For more information, see [Usage](https://github.com/docker/build-push-action#usage) in the README of the `docker/build-push-action` repository.
      # It uses the `tags` and `labels` parameters to tag and label the image with the output from the "meta" step.
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # a rebuild can move to a newer digest of the base image than the one pinned in the Dockerfile
          build-args: ${{ inputs.base_image && format('BASE_IMAGE={0}', inputs.base_image) || '' }}
          # SBOM attestation attached to the image, alongside the provenance attestations
          sbom: true

      # Keyless signature with the workflow's own GitHub identity, recorded in Sigstore's transparency log, so
      # there are no keys to keep. Signed by digest, which covers every tag pointing at it. A release is signed
      # as this workflow at refs/tags/<tag>, and a rebuild, which runs from main, at refs/heads/main.
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME,,}@${DIGEST}"

      # This step generates an artifact attestation for the image, which is an unforgeable statement about where and how it was built. It increases supply chain security for people who consume the image. For more information, see [Using artifact attestations to establish provenance for builds](/actions/security-guides/using-artifact-attestations-to-establish-provenance-for-builds).
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
