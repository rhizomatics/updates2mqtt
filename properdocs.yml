site_name: Updates2MQTT
site_url: https://updates2mqtt.rhizomatics.org.uk
site_description: Notify and take action on server updates via MQTT, with HomeAssistant compatibility

repo_name: rhizomatics/updates2mqtt
repo_url: https://github.com/rhizomatics/updates2mqtt
edit_uri: edit/main/docs/

theme:
  name: materialx
  highlightjs: true
  logo: images/updates2mqtt-dark-256x256.png
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.select
    - content.code.annotate 
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - toc.follow
    - toc.integrate
    - search.suggest
    - search
    - search.share

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rhizomatics

plugins:
  - search
  - llmstxt:
      markdown_description: >
        Updates2MQTT monitors Docker images, Portainer stacks and local Git-based builds
        for updates, publishes update details over MQTT, and integrates with Home
        Assistant's MQTT Update entities, optionally applying the update when asked.
        Logos, release notes and source links come from built-in common packages and
        the linuxserver.io and hotio.dev catalogues. Start with installation and
        configuration guidance; use the Home Assistant and troubleshooting pages for
        integration and operations.
      full_output: llms-full.txt
      sections:
        Start here:
          - index.md: Project overview, capabilities, and quick start
          - installation.md: Installation and deployment options
          - changelog.md: What's new in each release
        Configuration:
          - configuration/index.md: Overview of configuring the agent and individual containers
          - configuration/using_a_config_file.md: The optional config.yaml file and its settings
          - configuration/zero_config_file.md: Running with only environment variables and container labels
          - configuration/customizing_containers.md: Per-container logos, release notes, update and ignore settings via env vars or labels
          - configuration/common_packages.md: Built-in package metadata, and automatic linuxserver.io and hotio.dev lookups
          - configuration/portainer.md: Running on Portainer hosts and redeploying Portainer stacks
          - configuration/remote_api_usage.md: Remote APIs called, private registry credentials and rate limits
          - configuration/security.md: Moving secrets out of config, restricting MQTT update commands and Docker API access, and other hardening
          - configuration/supply_chain.md: Supply chain protection - digest-pinned installs, release history, version tag moves and update cooldowns
          - configuration/examples/index.md: Example configuration and Docker Compose files
          - configuration/examples/config_minimal.md: Smallest working config.yaml
          - configuration/examples/config_maximal.md: config.yaml using all features
          - configuration/examples/docker_compose.md: Docker Compose file to run Updates2MQTT
          - configuration/examples/env.md: Example .env file for Docker Compose
        Home Assistant and operations:
          - home_assistant.md: MQTT discovery and Home Assistant update entities
        Help and support:
          - help/index.md: Where to get help, raise issues or join discussions
          - help/faqs.md: Frequently asked questions, such as changing the scan interval
          - help/ai_help.md: Using Google and AI agents for help with Updates2MQTT
          - help/troubleshooting.md: Common issues and diagnostics
        Development:
          - local_builds.md: Tracking updates for locally built images
          - developer/index.md: Developer documentation overview
          - developer/design/rfcs/rfc0001-oci_client.md: RFC 0001, design and use of the self-contained OCI registry client, with OCI image indexes, manifests, configs and annotations in its appendix
          - developer/design/rfcs/rfc0002-cyber_security.md: RFC 0002, supply chain protection with update cooldowns, digest pinning, signature verification and image scanning
          - developer/design/rfcs/rfc0003-configuration.md: RFC 0003, options for moving configuration off OmegaConf 2.3
          - developer/design/index.md: Design notes
          - developer/design/roadmap.md: Planned major features and improvements
  - htmlproofer:
      skip_downloads: True
  - autorefs
  - redirects:
      redirect_maps:
        troubleshooting.md: help/troubleshooting.md
  - pagetree
  - optimize
  - mermaid2
  - tags:
      tags: false
  - meta-descriptions
  - minify:
      minify_html: true
  - coverage:
      page_path: developer/coverage
      html_report_dir: htmlcov

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - smarty
  - toc:
      permalink: true
  - sane_lists
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn 

not_in_nav: |
  de/
  es/
  fr/
  hi/
  it/
  ja/
  nl/
  pl/
  pt/
  zh-Hans/
